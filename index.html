<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Yum Human</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;overscroll-behavior:none;background:#000}body{background:#000;display:flex;justify-content:center;align-items:center;width:100vw;height:100dvh;font-family:'Courier New',monospace;overflow:hidden;position:fixed;top:0;left:0;}
canvas{display:block;image-rendering:pixelated;cursor:crosshair;touch-action:none}
#game-wrapper{position:absolute;width:800px;height:600px;top:0;left:0}
footer{position:fixed;bottom:max(4px,env(safe-area-inset-bottom));width:100%;text-align:center;color:#334;font-size:10px;z-index:0;pointer-events:none}

/* Shop Overlay */
#shop-overlay{
  display:none;position:absolute;top:0;left:0;width:800px;height:600px;z-index:20;
  background:#0a0a1a;overflow-y:auto;-webkit-overflow-scrolling:touch;font-family:'Courier New',monospace;
}
#shop-overlay .shop-inner{padding:20px 16px;max-width:660px;margin:0 auto}
#shop-overlay h1{color:#0f0;text-align:center;font-size:24px;margin-bottom:4px;text-shadow:0 0 15px #0f0}
#shop-overlay .shop-tagline{color:#8f8;text-align:center;font-size:12px;margin-bottom:10px}
#shop-overlay .shop-money{color:#ff0;text-align:center;font-size:20px;font-weight:bold;margin-bottom:16px}
#shop-overlay .shop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
@media(max-width:600px){#shop-overlay .shop-grid{grid-template-columns:repeat(2,1fr)}}
#shop-overlay .shop-card{
  background:#111133;border:1px solid #2a2a6a;border-radius:10px;padding:16px;text-align:center;
}
#shop-overlay .shop-card.cow-locked{background:#1a1a1a;border-color:#333}
#shop-overlay .shop-card.cow-unlocked{border-color:#FFD700;box-shadow:0 0 12px rgba(255,215,0,0.4)}
#shop-overlay .shop-card .card-name{color:#0f0;font-weight:bold;font-size:13px;margin-bottom:4px}
#shop-overlay .shop-card .card-desc{color:#8f8;font-size:11px;margin-bottom:6px}
#shop-overlay .shop-card .card-cost{color:#ff0;font-size:12px;margin-bottom:6px}
#shop-overlay .shop-card .card-dots{margin-bottom:8px;display:flex;justify-content:center;gap:6px}
#shop-overlay .shop-card .card-dots .dot{width:10px;height:10px;border-radius:50%;background:#333;display:inline-block}
#shop-overlay .shop-card .card-dots .dot.filled{background:#0f0}
#shop-overlay .shop-card button.buy-btn{
  background:#00ff88;color:#000;border:none;border-radius:6px;padding:8px 18px;
  font-weight:bold;cursor:pointer;margin-top:8px;font-family:'Courier New',monospace;font-size:12px;
  transition:background 0.15s;touch-action:manipulation;
}
#shop-overlay .shop-card button.buy-btn:hover:not(:disabled){background:#00cc66}
#shop-overlay .shop-card button.buy-btn:disabled{background:#333;color:#666;cursor:not-allowed}
#shop-overlay .continue-btn{
  display:block;margin:0 auto;background:#0a4;color:#0f0;border:2px solid #0f0;
  border-radius:10px;padding:14px 32px;font-size:18px;font-weight:bold;cursor:pointer;
  font-family:'Courier New',monospace;transition:background 0.15s;touch-action:manipulation;
}
#shop-overlay .continue-btn:hover{background:#0c6}

/* Post-Boss Overlay */
#postboss-overlay{
  display:none;position:absolute;top:0;left:0;width:800px;height:600px;z-index:20;
  background:rgba(5,5,16,0.95);font-family:'Courier New',monospace;
  flex-direction:column;align-items:center;justify-content:center;text-align:center;
}
#postboss-overlay.visible{display:flex}
#postboss-overlay h1{
  color:#FFD700;font-size:36px;margin-bottom:16px;
  animation:bossGlow 1.5s ease-in-out infinite alternate;
}
@keyframes bossGlow{
  0%{text-shadow:0 0 10px #FFD700,0 0 20px #FFD700}
  100%{text-shadow:0 0 25px #FFD700,0 0 50px #ff8c00,0 0 75px #ff4500}
}
#postboss-overlay .pb-info{color:#aaa;font-size:16px;margin-bottom:8px}
#postboss-overlay .pb-money{color:#ff0;font-size:24px;font-weight:bold;margin-bottom:24px}
#postboss-overlay .pb-btn{
  background:#0a4;color:#0f0;border:2px solid #0f0;border-radius:10px;
  padding:16px 36px;font-size:20px;font-weight:bold;cursor:pointer;
  font-family:'Courier New',monospace;transition:background 0.15s;
  animation:btnPulse 2s ease-in-out infinite alternate;touch-action:manipulation;
}
#postboss-overlay .pb-btn:hover{background:#0c6}
@keyframes btnPulse{
  0%{box-shadow:0 0 8px #0f0}
  100%{box-shadow:0 0 24px #0f0,0 0 48px rgba(0,255,0,0.3)}
}

/* Boss Incoming Banner */
#boss-incoming{
  display:none;position:absolute;top:0;left:0;width:800px;height:600px;z-index:15;
  background:rgba(0,0,0,0.85);font-family:'Courier New',monospace;
  flex-direction:column;align-items:center;justify-content:center;text-align:center;
}
#boss-incoming.visible{display:flex}
#boss-incoming h1{
  color:#f44;font-size:28px;
  animation:warnFlash 0.5s ease-in-out infinite alternate;
}
@keyframes warnFlash{0%{opacity:0.6}100%{opacity:1;text-shadow:0 0 20px #f00}}
#boss-incoming p{color:#f88;font-size:14px;margin-top:12px}

/* Pause Button */
#pauseBtn{
  position:absolute;top:10px;right:10px;z-index:30;
  background:rgba(0,0,0,0.6);color:#00ff88;border:2px solid #00ff88;
  border-radius:8px;font-size:20px;width:44px;height:44px;cursor:pointer;
  display:none;touch-action:manipulation;font-family:'Courier New',monospace;
  line-height:1;
}
#pauseBtn:active{background:rgba(0,255,136,0.3)}

/* Mobile Controls */
#mobileControls{
  position:absolute;top:0;left:0;width:800px;height:600px;
  pointer-events:none;display:none;z-index:25;
}
.dpad-btn{
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,255,136,0.2);border:2px solid rgba(0,255,136,0.45);
  border-radius:8px;font-size:18px;color:rgba(0,255,136,0.7);
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
.dpad-btn:active,.dpad-btn.active{background:rgba(0,255,136,0.5)}
#beamBtn{touch-action:manipulation;user-select:none;-webkit-user-select:none}
#beamBtn:active,#beamBtn.active{background:rgba(0,200,80,0.55) !important}
#shootBtn{touch-action:manipulation;user-select:none;-webkit-user-select:none}
#shootBtn:active,#shootBtn.active{background:rgba(0,150,255,0.55) !important}
</style>
</head>

<script>var vpArcadeRun=null;function vpArcadeSend(data){if(window.parent===window)return;for(var origin of ['https://venomouspress.com','https://www.venomouspress.com'])window.parent.postMessage(data,origin);}</script>
<script>
(function(){
"use strict";
const C=document.getElementById('gc');
const X=C.getContext('2d');
const W=800,H=600;
const shopOverlay=document.getElementById('shop-overlay');
const postbossOverlay=document.getElementById('postboss-overlay');
const bossIncomingEl=document.getElementById('boss-incoming');
const pauseBtn=document.getElementById('pauseBtn');
const mobileControlsEl=document.getElementById('mobileControls');

// ── Play Mode ──
// Automatically select touch-first controls on phones/tablets.
const isMobile=('ontouchstart' in window)||navigator.maxTouchPoints>0||
  (window.matchMedia&&window.matchMedia('(pointer: coarse)').matches);
var playMode=isMobile?'PHONE':'PC';
const mobileKeys={up:false,down:false,left:false,right:false,beam:false,shoot:false,pulse:false,dash:false};

// ── Pause State ──
let paused=false;

function togglePause(){
  paused=!paused;
  pauseBtn.textContent=paused?'▶':'⏸';
}

function drawPauseOverlay(){
  X.fillStyle='rgba(0,0,0,0.6)';
  X.fillRect(0,0,W,H);
  X.fillStyle='#00ff88';
  X.font='bold 56px monospace';
  X.textAlign='center';
  X.fillText('⏸ PAUSED',W/2,250);
  X.fillStyle='#aaa';
  X.font='20px monospace';
  X.fillText(playMode==='PHONE'?'Tap ▶ to resume':'Press ESC or tap ▶ to resume',W/2,300);
  X.textAlign='left';
}

// ── Responsive Scaling ──
function resizeGame(){
  var wrapper=document.getElementById('game-wrapper');
  if(!wrapper)return;
  var vp=window.visualViewport;
  var vw=vp?vp.width:window.innerWidth;
  var vh=vp?vp.height:window.innerHeight;
  var scaleX=vw/800;
  // Reserve a separate control deck below the canvas on touch devices.
  var layoutH=playMode==='PHONE'?820:600;
  wrapper.style.height=layoutH+'px';
  var scaleY=vh/layoutH;
  var scale=Math.min(scaleX,scaleY);
  var scaledW=800*scale;
  var scaledH=layoutH*scale;
  var offsetX=Math.floor((vw-scaledW)/2);
  var offsetY=Math.floor((vh-scaledH)/2);
  wrapper.style.transform='scale('+scale+')';
  wrapper.style.transformOrigin='0 0';
  wrapper.style.left=offsetX+'px';
  wrapper.style.top=offsetY+'px';
  wrapper.style.position='absolute';
}
window.addEventListener('resize',resizeGame);
window.addEventListener('orientationchange',function(){setTimeout(resizeGame,250);});
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',resizeGame);
  window.visualViewport.addEventListener('scroll',resizeGame);
}
resizeGame();

// ── Show/Hide Pause & Mobile Controls ──
function updateUIVisibility(){
  var showGameplay=(state==='CAPTURE'||state==='BOSS');
  pauseBtn.style.display=showGameplay?'block':'none';
  var showMobileControls=(playMode==='PHONE');
  if(showMobileControls&&showGameplay&&!paused){
    mobileControlsEl.style.display='block';
    var pulseBtn=document.getElementById('pulseBtn');
    var dashBtn=document.getElementById('dashBtn');
    if(pulseBtn)pulseBtn.style.display=upgrades.panicPulse>0?'flex':'none';
    if(dashBtn)dashBtn.style.display=upgrades.slipstream>0?'flex':'none';
  }else{
    mobileControlsEl.style.display='none';
  }
  if(!showGameplay&&paused){paused=false;pauseBtn.textContent='⏸'}
}

// ── Phone mode enlarged controls ──
function applyPhoneControls(){
  mobileControlsEl.style.top=H+'px';
  mobileControlsEl.style.height='220px';
  mobileControlsEl.style.background='#080e16';
  mobileControlsEl.style.borderTop='2px solid #15352b';
  document.querySelectorAll('.dpad-btn').forEach(function(b){
    b.style.width='60px';
    b.style.height='60px';
    b.style.fontSize='26px';
  });
  var dp=document.getElementById('dpad');
  if(dp){dp.style.width='170px';dp.style.height='170px';dp.style.bottom='25px';dp.style.left='20px';}
  var dUp=document.getElementById('dUp');if(dUp){dUp.style.left='55px';dUp.style.top='0';}
  var dDown=document.getElementById('dDown');if(dDown){dDown.style.left='55px';dDown.style.bottom='0';}
  var dLeft=document.getElementById('dLeft');if(dLeft){dLeft.style.left='0';dLeft.style.top='55px';}
  var dRight=document.getElementById('dRight');if(dRight){dRight.style.right='0';dRight.style.top='55px';}
  var bb=document.getElementById('beamBtn');
  if(bb){bb.style.width='110px';bb.style.height='110px';bb.style.fontSize='15px';bb.style.right='150px';bb.style.bottom='55px';}
  var sb=document.getElementById('shootBtn');
  if(sb){sb.style.width='110px';sb.style.height='110px';sb.style.fontSize='15px';sb.style.right='20px';sb.style.bottom='55px';}
  ['pulseBtn','dashBtn'].forEach(function(id){
    document.getElementById(id).style.bottom='8px';
  });
}

// ── Audio ──
let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function audioOk(){return audioCtx&&audioCtx.state==='running'}
function playTone(freq,dur,type,vol,freqEnd){
  if(!audioOk())return;
  try{
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(freq,audioCtx.currentTime);
    if(freqEnd)o.frequency.linearRampToValueAtTime(freqEnd,audioCtx.currentTime+dur);
    g.gain.setValueAtTime(vol||0.15,audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(0,audioCtx.currentTime+dur);
    o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
function sfxBeamHum(){playTone(220,0.08,'sine',0.08)}
function sfxCapture(){playTone(262,0.1,'sine',0.12);setTimeout(()=>playTone(330,0.1,'sine',0.12),100);setTimeout(()=>playTone(392,0.1,'sine',0.12),200);setTimeout(()=>playTone(523,0.15,'sine',0.12),300)}
function sfxShoot(){playTone(800,0.05,'square',0.08,200)}
function sfxHit(){playTone(150,0.2,'sawtooth',0.1)}
function sfxEnemyDeath(){playTone(400,0.3,'square',0.1,100)}
function sfxBossHit(){playTone(120,0.15,'triangle',0.12)}
function sfxPhaseShift(){playTone(200,0.8,'sine',0.1,400);setTimeout(()=>playTone(300,0.6,'triangle',0.08),100)}
function sfxBossDeath(){playTone(600,1.5,'sawtooth',0.12,40)}
function sfxPurchase(){playTone(880,0.1,'sine',0.1);setTimeout(()=>playTone(1100,0.15,'sine',0.1),100)}
function sfxPanicPulse(){playTone(60,0.5,'sine',0.2,30);playTone(80,0.4,'triangle',0.15,40)}
function sfxDash(){playTone(1200,0.15,'sine',0.1,600)}
function sfxMoo(){
  if(!audioOk())return;
  try{
    const o=audioCtx.createOscillator();const g=audioCtx.createGain();
    o.type='sawtooth';o.frequency.setValueAtTime(100,audioCtx.currentTime);
    o.frequency.linearRampToValueAtTime(80,audioCtx.currentTime+0.15);
    o.frequency.linearRampToValueAtTime(120,audioCtx.currentTime+0.25);
    o.frequency.linearRampToValueAtTime(90,audioCtx.currentTime+0.35);
    g.gain.setValueAtTime(0.12,audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(0,audioCtx.currentTime+0.4);
    o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+0.4);
  }catch(e){}
}

// ── Input ──
const keys={};
let mouseX=W/2,mouseY=H/2,mouseDown=false;
document.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;keys[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(e.key==='Escape'){
    if(state==='CAPTURE'||state==='BOSS')togglePause();
  }
});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;keys[e.code]=false});
C.addEventListener('mousemove',e=>{const r=C.getBoundingClientRect();const sx=W/r.width;mouseX=(e.clientX-r.left)*sx;mouseY=(e.clientY-r.top)*sx});
C.addEventListener('mousedown',e=>{mouseDown=true;initAudio();if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume()});
C.addEventListener('mouseup',()=>{mouseDown=false});

// ── Unified click handler ──
function handleClick(cx,cy){
  if(state==='MENU'){
    if(showHowTo){showHowTo=false;return}
    if(hitBtn(cx,cy,W/2,410,220,58)){
      if(playMode==='PHONE')applyPhoneControls();
      initAudio();if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
      moneyEarnedThisCycle=0;startFade('CAPTURE');updateUIVisibility();
      return;
    }
    if(hitBtn(cx,cy,W/2,485,200,40)){showHowTo=true;return}
    if(money>0&&hitBtn(cx,cy,W/2,545,120,32)){resetGame();return}
  }
  if(state==='GAMEOVER'){
    if(hitBtn(cx,cy,W/2,380,180,48)){startFade('CAPTURE');return}
    if(hitBtn(cx,cy,W/2,445,180,48)){startFade('MENU');updateUIVisibility();return}
  }
}

C.addEventListener('click',function(e){
  initAudio();if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  var r=C.getBoundingClientRect();var sx=W/r.width;var sy=H/r.height;
  var cx=(e.clientX-r.left)*sx,cy=(e.clientY-r.top)*sy;
  handleClick(cx,cy);
});

C.addEventListener('touchstart',function(e){
  e.preventDefault();initAudio();if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  var t=e.touches[0];
  var r=C.getBoundingClientRect();
  var sx=W/r.width;var sy=H/r.height;
  var cx=(t.clientX-r.left)*sx;
  var cy=(t.clientY-r.top)*sy;
  mouseX=cx;mouseY=cy;mouseDown=true;
  handleClick(cx,cy);
},{passive:false});
C.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];const r=C.getBoundingClientRect();const sx=W/r.width;mouseX=(t.clientX-r.left)*sx;mouseY=(t.clientY-r.top)*(H/r.height)},{passive:false});
C.addEventListener('touchend',()=>{mouseDown=false});
C.addEventListener('touchcancel',()=>{mouseDown=false});

// ── Mobile Touch Wiring ──
function wireDpad(elId,keyName){
  var el=document.getElementById(elId);
  if(!el)return;
  el.addEventListener('touchstart',function(e){e.preventDefault();e.stopPropagation();mobileKeys[keyName]=true;el.classList.add('active')},{passive:false});
  el.addEventListener('touchend',function(e){e.preventDefault();e.stopPropagation();mobileKeys[keyName]=false;el.classList.remove('active')},{passive:false});
  el.addEventListener('touchcancel',function(e){mobileKeys[keyName]=false;el.classList.remove('active')});
}
wireDpad('dUp','up');
wireDpad('dDown','down');
wireDpad('dLeft','left');
wireDpad('dRight','right');

var beamBtnEl=document.getElementById('beamBtn');
beamBtnEl.addEventListener('touchstart',function(e){e.preventDefault();e.stopPropagation();mobileKeys.beam=true;beamBtnEl.classList.add('active');initAudio();if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume()},{passive:false});
beamBtnEl.addEventListener('touchend',function(e){e.preventDefault();e.stopPropagation();mobileKeys.beam=false;beamBtnEl.classList.remove('active')},{passive:false});
beamBtnEl.addEventListener('touchcancel',function(){mobileKeys.beam=false;beamBtnEl.classList.remove('active')});

var shootBtnEl=document.getElementById('shootBtn');
shootBtnEl.addEventListener('touchstart',function(e){e.preventDefault();e.stopPropagation();mobileKeys.shoot=true;shootBtnEl.classList.add('active');initAudio();if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume()},{passive:false});
shootBtnEl.addEventListener('touchend',function(e){e.preventDefault();e.stopPropagation();mobileKeys.shoot=false;shootBtnEl.classList.remove('active')},{passive:false});
shootBtnEl.addEventListener('touchcancel',function(){mobileKeys.shoot=false;shootBtnEl.classList.remove('active')});

var pulseBtnEl=document.getElementById('pulseBtn');
if(pulseBtnEl){
  pulseBtnEl.addEventListener('touchstart',function(e){e.preventDefault();e.stopPropagation();mobileKeys.pulse=true;pulseBtnEl.classList.add('active')},{passive:false});
  pulseBtnEl.addEventListener('touchend',function(e){e.preventDefault();e.stopPropagation();mobileKeys.pulse=false;pulseBtnEl.classList.remove('active')},{passive:false});

  else{ctx.beginPath();ctx.moveTo(-16,4);ctx.lineTo(-22,14);ctx.stroke();ctx.beginPath();ctx.moveTo(16,4);ctx.lineTo(22,14);ctx.stroke()}

  ctx.fillStyle='#111';

  else{ctx.beginPath();ctx.arc(-5,-15,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(5,-15,2,0,Math.PI*2);ctx.fill()}

// ── Panic Pulse visual ──
let panicPulseRadius=0;
let panicPulseActive=false;

// ── Update ──
let lastTime=0;
function gameLoop(ts){
  try{
    var rawDt=(ts-lastTime)/1000;
    var dt=Math.min(rawDt,0.05);
    lastTime=ts;
    if(paused){
      render();
      drawPauseOverlay();
      requestAnimationFrame(gameLoop);
      return;
    }
    gameTime+=dt;
    update(dt);
    render();
  }catch(err){
    console.error('Game loop error:',err);
  }
  requestAnimationFrame(gameLoop);
}

function update(dt){
  try{
    stars.forEach(function(s){s.twinkle+=dt*s.speed});
    if(fadeDir===1){fadeAlpha+=dt*2;if(fadeAlpha>=1){fadeAlpha=1;fadeDir=-1;transitionTo(fadeTarget)}}
    else if(fadeDir===-1){fadeAlpha-=dt*2;if(fadeAlpha<=0){fadeAlpha=0;fadeDir=0}}
    if(screenShake>0)screenShake=Math.max(0,screenShake-dt*15);
    particles.forEach(function(p){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});
    particles=particles.filter(function(p){return p.life>0});
    if(particles.length>100)particles=particles.slice(-80);
    floatingTexts.forEach(function(t){t.y+=t.vy*dt;t.life-=dt});
    floatingTexts=floatingTexts.filter(function(t){return t.life>0});
    comboTimer-=dt;if(comboTimer<=0)combo=0;
    if(cowUnlockBanner>0)cowUnlockBanner-=dt;
    if(cowMuzzleFlash>0)cowMuzzleFlash-=dt;
    dashTrail=dashTrail.filter(function(d){d.life-=dt;return d.life>0});
    if(fadeDir!==0)return;
    if(state==='MENU')updateMenu(dt);
    else if(state==='CAPTURE')updateCapture(dt);
    else if(state==='BOSS')updateBoss(dt);
    else if(state==='VICTORY')updateVictory(dt);
    else if(state==='BOSS_INCOMING')updateBossIncoming(dt);
  }catch(err){console.error('Update error:',err)}
}

function updateMenu(dt){
  menuUfoX+=menuUfoDir*120*dt;
  if(menuUfoX>700)menuUfoDir=-1;
  if(menuUfoX<100)menuUfoDir=1;
}

function updateCapture(dt){
  if(introTimer>0){introTimer-=dt;return}
  if(levelCompleteBanner>0){
    levelCompleteBanner-=dt;
    if(levelCompleteBanner<=0){
      waveInCycle++;overallLevel++;saveGame();
      if(waveInCycle>=3){
        state='BOSS_INCOMING';bossIncomingTimer=2;
        var bi=BOSS_INTRO_DATA[cycleNumber%3];
        bossIncomingEl.querySelector('h1').textContent=bi.title;
        bossIncomingEl.querySelector('p').textContent=bi.sub;
        bossIncomingEl.style.display='flex';bossIncomingEl.classList.add('visible');
        updateUIVisibility();
        return;
      }
      startFade('CAPTURE');
    }
    return;
  }
  if(quotaBanner>0){
    quotaBanner-=dt;
    if(quotaBanner<=0){
      if(!quotaBonusGiven){money+=15;moneyEarnedThisCycle+=15;addText(W/2,H/2+40,'+$15 QUOTA BONUS','#ff0',1.5);quotaBonusGiven=true;saveGame()}
      levelCompleteBanner=1.5;addParticles(W/2,H/2,'#0f0',20,150,1);
    }
    return;
  }
  captureTimer-=dt;
  if(captureTimer<=0&&!quotaMet){state='GAMEOVER';updateUIVisibility();return}
  updatePlayer(dt);
  updateCreatures(dt);
  updateRivals(dt);
  updateBullets(dt);
  updatePanicPulse(dt);
  checkQuotas();
}

function updateBossIncoming(dt){
  bossIncomingTimer-=dt;
  if(bossIncomingTimer<=0){
    bossIncomingEl.style.display='none';bossIncomingEl.classList.remove('visible');
    startFade('BOSS');
  }
}

function updatePlayer(dt){
  if(player.dead){player.respawnTime-=dt;if(player.respawnTime<=0){player.dead=false;player.x=400;player.y=80;player.invTime=1.5}return}
  player.invTime=Math.max(0,player.invTime-dt);
  player.flashTime=Math.max(0,player.flashTime-dt);
  panicPulseCooldown=Math.max(0,panicPulseCooldown-dt);
  slipstreamCooldown=Math.max(0,slipstreamCooldown-dt);

  if(slipstreamActive>0){
    slipstreamActive-=dt;
    player.x+=slipstreamDirX*600*dt;
    player.y+=slipstreamDirY*600*dt;
    player.x=Math.max(28,Math.min(W-28,player.x));
    player.y=Math.max(14,Math.min(H-14,player.y));
    dashTrail.push({x:player.x,y:player.y,life:0.3,maxLife:0.3});
    return;
  }

  var spd=moveSpeed();
  var dx=0,dy=0;
  if(keys['w']||keys['arrowup']||keys['ArrowUp']||mobileKeys.up)dy=-1;
  if(keys['s']||keys['arrowdown']||keys['ArrowDown']||mobileKeys.down)dy=1;
  if(keys['a']||keys['arrowleft']||keys['ArrowLeft']||mobileKeys.left)dx=-1;
  if(keys['d']||keys['arrowright']||keys['ArrowRight']||mobileKeys.right)dx=1;
  if(dx||dy){var m=Math.sqrt(dx*dx+dy*dy);dx/=m;dy/=m}
  player.vx=dx*spd;player.vy=dy*spd;
  player.x+=player.vx*dt;player.y+=player.vy*dt;
  player.x=Math.max(28,Math.min(W-28,player.x));
  player.y=Math.max(14,Math.min(H-14,player.y));
  player.tilt+=(player.vx*0.002-player.tilt)*dt*8;
  player.beaming=keys[' ']||keys['Space']||mobileKeys.beam;
  if(player.beaming&&Math.random()<0.3)sfxBeamHum();

  if((keys['e']||keys['E']||mobileKeys.pulse)&&upgrades.panicPulse>0&&panicPulseCooldown<=0&&!panicPulseActive){
    panicPulseActive=true;panicPulseRadius=0;panicPulseCooldown=20;sfxPanicPulse();
  }

  if((keys['Shift']||keys['shift']||keys['ShiftLeft']||keys['ShiftRight']||mobileKeys.dash)&&upgrades.slipstream>0&&slipstreamCooldown<=0){
    slipstreamActive=0.2;slipstreamCooldown=3;
    slipstreamDirX=dx||0;slipstreamDirY=dy||0;
    if(slipstreamDirX===0&&slipstreamDirY===0)slipstreamDirX=1;
    sfxDash();
  }

  // Mobile shoot: auto-aim
  var mobileShootActive=mobileKeys.shoot;

  player.fireCooldown-=dt;
  if((mouseDown||mobileShootActive)&&player.fireCooldown<=0&&state!=='SHOP'){
    if(upgrades.cowBlaster>0){
      var ang;
      if(mobileShootActive&&!mouseDown){
        if(state==='BOSS'&&boss){ang=Math.atan2(boss.y-player.y,boss.x-player.x)}
        else{ang=Math.PI/2}
      }else{
        ang=Math.atan2(mouseY-player.y,mouseX-player.x);
      }
      for(var i=0;i<5;i++){
        var spread=(i-2)*0.21;
        playerBullets.push({x:player.x,y:player.y+10,vx:Math.cos(ang+spread)*350,vy:Math.sin(ang+spread)*350,life:2,dmg:2,isCow:true});
      }
      player.fireCooldown=0.8;
      sfxMoo();
      cowMuzzleFlash=0.1;
    }else{
      var ang;
      if(mobileShootActive&&!mouseDown){
        if(state==='BOSS'&&boss){ang=Math.atan2(boss.y-player.y,boss.x-player.x)}
        else{ang=Math.PI/2}
      }else{
        ang=Math.atan2(mouseY-player.y,mouseX-player.x);
      }
      playerBullets.push({x:player.x,y:player.y+10,vx:Math.cos(ang)*400,vy:Math.sin(ang)*400,life:2,dmg:blasterDmg()});
      player.fireCooldown=0.35;
      sfxShoot();
    }
  }
}

function updatePanicPulse(dt){
  if(!panicPulseActive)return;
  panicPulseRadius+=500*dt;
  if(panicPulseRadius>=200){panicPulseActive=false;panicPulseRadius=0;return}
  creatures.forEach(function(c){
    if(c.captured||c.pulling)return;
    var ddx=c.x-player.x,ddy=c.y-player.y;
    if(Math.sqrt(ddx*ddx+ddy*ddy)<panicPulseRadius){c.stunTimer=2.5}
  });
  enemyBullets=enemyBullets.filter(function(b){
    var ddx=b.x-player.x,ddy=b.y-player.y;
    if(Math.sqrt(ddx*ddx+ddy*ddy)<panicPulseRadius){addParticles(b.x,b.y,'#fff',3,40,0.3);return false}
    return true;
  });
}

function updateCreatures(dt){
  var bW=beamW(),bL=beamL(),mCap=multiCap();
  var beamingCount=0;

  var magnetActive=player.beaming&&!player.dead&&upgrades.magnetBeam>0;
  var magnetRadius=upgrades.magnetBeam>=2?220:160;
  var magnetSpeed=upgrades.magnetBeam>=2?45:25;

  creatures.forEach(function(c){
    if(c.captured)return;
    if(c.pulling){
      c.pullTimer+=dt;
      c.x+=(player.x-c.x)*dt*4;c.y+=(player.y-c.y)*dt*4;
      if(c.pullTimer>0.5){
        c.captured=true;
        var ct=CTYPES[c.type];
        money+=ct.value;moneyEarnedThisCycle+=ct.value;
        addParticles(c.x,c.y,'#0f0',12,100,0.8);
        addText(c.x,c.y-20,'+$'+ct.value,'#0f0');
        sfxCapture();
        quotas.forEach(function(q){if(q.type===c.type&&q.have<q.need)q.have++});
        comboTimer=2;combo++;
        if(combo>=2)addText(c.x,c.y-40,'x'+combo+' COMBO!','#ff0',1);
        if(c.type===5){
          totalCowsCaptured++;
          if(totalCowsCaptured===5&&upgrades.cowBlaster===0){
            cowUnlockBanner=2;
          }
        }
        saveGame();
        checkQuotas();
      }
      return;
    }
    var ct=CTYPES[c.type];
    var cT=getCapTime(c.type);
    var inBeam=false;
    if(player.beaming&&!player.dead&&beamingCount<mCap){
      var bx=player.x,by=player.y+14;
      var ddx=c.x-bx,ddy=c.y-by;
      if(ddy>0&&ddy<bL){
        var widthAtY=bW*(ddy/bL);
        if(Math.abs(ddx)<widthAtY/2){
          inBeam=true;beamingCount++;
          c.captureProgress+=dt/cT;
          if(ct.panicMult)c.panic=true;
          if(c.captureProgress>=1){c.pulling=true;c.pullTimer=0}
        }
      }
    }
    if(!inBeam){c.captureProgress=Math.max(0,c.captureProgress-dt*2);c.panic=false}

    if(c.stunTimer>0){c.stunTimer-=dt;c.vx=0;c.vy=0;
      c.y=Math.max(CREATURE_MOVE_MIN_Y,Math.min(CREATURE_MOVE_MAX_Y,c.y));
      return;
    }

    if(magnetActive&&!c.panic){
      var mdx=c.x-player.x;
      var mdy=c.y-(player.y+bL/2);
      if(Math.abs(mdx)<magnetRadius&&mdy>0&&mdy<bL){
        var drift=mdx>0?-magnetSpeed:magnetSpeed;
        c.x+=drift*dt;
      }
    }

    c.wanderTimer-=dt;
    var spd2=c.panic?(ct.speed*(ct.panicMult||1.5)):(ct.boltMult&&inBeam?ct.speed*ct.boltMult:ct.speed);
    if(c.wanderTimer<=0){
      c.wanderTimer=ct.name==='Cluck'?0.5:(1.5+Math.random()*1.5);
      if(ct.speed<=25&&Math.random()<0.4){c.stopTimer=1+Math.random();c.vx=0;c.vy=0}
      else{var a=Math.random()*Math.PI*2;c.vx=Math.cos(a)*spd2;c.vy=Math.sin(a)*spd2*0.4;c.facing=c.vx>0?1:-1}
    }
    if(c.stopTimer>0){c.stopTimer-=dt;c.vx=0;c.vy=0}
    if(c.panic){
      var ddx2=c.x-player.x,ddy2=c.y-player.y;var d=Math.sqrt(ddx2*ddx2+ddy2*ddy2)||1;
      c.vx=ddx2/d*spd2;c.vy=ddy2/d*spd2*0.4;c.facing=c.vx>0?1:-1;
    }
    c.x+=c.vx*dt;c.y+=c.vy*dt;

    if(c.x<40){c.x=40;c.vx=Math.abs(c.vx);c.facing=1}
    if(c.x>W-40){c.x=W-40;c.vx=-Math.abs(c.vx);c.facing=-1}
    c.y=Math.max(CREATURE_MOVE_MIN_Y,Math.min(CREATURE_MOVE_MAX_Y,c.y));
    if(c.y<=CREATURE_MOVE_MIN_Y)c.vy=Math.abs(c.vy);
    if(c.y>=CREATURE_MOVE_MAX_Y)c.vy=-Math.abs(c.vy);
  });
}

function updateRivals(dt){
  rivals.forEach(function(r){
    if(r.dead){r.respawnTimer-=dt;if(r.respawnTimer<=0){r.dead=false;r.hp=r.maxHP;r.x=Math.random()*600+100;r.y=50+Math.random()*60}return}
    r.flashTime=Math.max(0,r.flashTime-dt);
    r.x+=r.vx*dt;
    if(r.x<60||r.x>W-60)r.vx*=-1;
    r.fireTimer-=dt;
    if(r.fireTimer<=0&&!player.dead){
      r.fireTimer=2.5+Math.random()*1.5;
      var ang=Math.atan2(player.y-r.y,player.x-r.x);
      enemyBullets.push({x:r.x,y:r.y+12,vx:Math.cos(ang)*180,vy:Math.sin(ang)*180,life:3,color:'#f44'});
    }
    r.beamTimer-=dt;
    if(r.beamTimer<=0){
      r.beamTimer=6+Math.random()*4;
      var avail=creatures.filter(function(c){return !c.captured&&!c.pulling});
      if(avail.length)r.beamTarget=creatures.indexOf(avail[Math.floor(Math.random()*avail.length)]);
      r.beamProgress=0;
    }
    if(r.beamTarget>=0&&r.beamTarget<creatures.length){
      var tgt=creatures[r.beamTarget];
      if(tgt&&!tgt.captured&&!tgt.pulling){
        var ddx=tgt.x-r.x,ddy=tgt.y-r.y;
        if(ddy>0&&ddy<200&&Math.abs(ddx)<80){
          r.beamProgress+=dt/2;
          if(r.beamProgress>=1){tgt.captured=true;addText(tgt.x,tgt.y-20,'STOLEN!','#f44',1.5);addParticles(tgt.x,tgt.y,'#f44',8,80,0.6);r.beamTarget=-1;r.beamProgress=0}
        }else{r.beamProgress=Math.max(0,r.beamProgress-dt)}
      }else{r.beamTarget=-1;r.beamProgress=0}
    }
  });
}

function updateBullets(dt){
  playerBullets.forEach(function(b){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt});
  playerBullets=playerBullets.filter(function(b){return b.life>0&&b.x>0&&b.x<W&&b.y>0&&b.y<H});
  enemyBullets.forEach(function(b){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt});
  enemyBullets=enemyBullets.filter(function(b){return b.life>0&&b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20});
  if(state==='CAPTURE'){
    playerBullets.forEach(function(b){
      rivals.forEach(function(r){
        if(r.dead)return;
        if(Math.abs(b.x-r.x)<25&&Math.abs(b.y-r.y)<14){
          r.hp-=b.dmg;b.life=0;r.flashTime=0.15;
          addParticles(r.x,r.y,'#fa0',6,80,0.5);
          if(r.hp<=0){r.dead=true;r.respawnTimer=10;money+=12;moneyEarnedThisCycle+=12;addText(r.x,r.y-20,'+$12','#ff0');sfxEnemyDeath();addParticles(r.x,r.y,'#f80',15,120,0.8);saveGame()}
        }
      });
    });
  }
  if(!player.dead&&player.invTime<=0&&slipstreamActive<=0){
    enemyBullets.forEach(function(b){
      if(Math.abs(b.x-player.x)<20&&Math.abs(b.y-player.y)<14){b.life=0;hitPlayer()}
    });
  }
}

function hitPlayer(){
  if(player.invTime>0||player.dead||slipstreamActive>0)return;
  if(armorCharges>0){
    armorCharges--;player.invTime=0.8;player.flashTime=0.3;
    addParticles(player.x,player.y,'#FFD700',8,80,0.5);
    addText(player.x,player.y-30,'ARMOR!','#FFD700',1);
    screenShake=3;
    return;
  }
  hearts--;sfxHit();screenShake=5;player.invTime=1.5;player.flashTime=0.3;
  addParticles(player.x,player.y,'#f80',10,100,0.6);
  if(hearts<=0){player.dead=true;player.respawnTime=999;addParticles(player.x,player.y,'#f00',20,150,1);
    setTimeout(function(){if(state==='CAPTURE'||state==='BOSS'){state='GAMEOVER';updateUIVisibility()}},1500);
  }
}

function checkQuotas(){
  if(quotaMet)return;
  var allMet=quotas.every(function(q){return q.have>=q.need});
  if(allMet){quotaMet=true;quotaBanner=2.5;addParticles(W/2,H/2,'#0f0',30,200,1.5)}
}

// ══════════════════════════════════════
// ── BOSS UPDATE ──
// ══════════════════════════════════════

function updateBoss(dt){
  if(bossEntrance>0){bossEntrance-=dt;boss.y+=(120-boss.y)*dt*1.5;if(bossEntrance<=0)boss.y=120;return}
  updatePlayer(dt);
  updateBullets(dt);
  updatePanicPulse(dt);
  boss.flashTime=Math.max(0,(boss.flashTime||0)-dt);

  var hpRatio=bossHP/bossMaxHP;
  var phase=1;
  if(hpRatio<=1/bossMaxHP)phase=3;
  else if(hpRatio<=3/bossMaxHP)phase=2;
  if(phase!==bossPhase){bossPhase=phase;sfxPhaseShift();screenShake=8;addText(W/2,H/2,'PHASE '+phase+'!','#f0f',1.5)}

  if(currentBossType===0)updateBossGrixoth(dt);
  else if(currentBossType===1)updateBossBlurp(dt);
  else updateBossZara(dt);

  enemyBullets.forEach(function(b){
    if(b.homing&&!player.dead){
      var ang=Math.atan2(player.y-b.y,player.x-b.x);
      b.vx+=(Math.cos(ang)*120-b.vx)*dt*2;
      b.vy+=(Math.sin(ang)*120-b.vy)*dt*2;
    }
  });

  playerBullets.forEach(function(b){
    if(boss&&Math.abs(b.x-boss.x)<50&&Math.abs(b.y-boss.y)<40){
      b.life=0;bossHP-=b.dmg;boss.flashTime=0.2;screenShake=4;sfxBossHit();
      addParticles(b.x,b.y,'#f0f',8,100,0.5);
      if(bossHP<=0){
        sfxBossDeath();screenShake=12;
        if(currentBossType===1){
          addParticles(boss.x,boss.y,'#1aaa88',40,200,2);addText(boss.x,boss.y-40,'BLURP!!!','#1aaa88',2);
        }else if(currentBossType===2){
          addParticles(boss.x,boss.y,'#ff44aa',40,200,2);addParticles(boss.x,boss.y,'#FFD700',30,180,1.5);
          addText(boss.x,boss.y-40,'\u2728 QUEEN DEFEATED \u2728','#ff44aa',2);
        }else{
          addParticles(boss.x,boss.y,'#f0f',40,200,2);addParticles(boss.x,boss.y,'#ff0',30,180,1.5);
        }
        money+=60;moneyEarnedThisCycle+=60;
        addText(boss.x,boss.y,'+$60','#ff0',2);
        boss=null;victoryTimer=2;state='VICTORY';updateUIVisibility();saveGame();
      }
    }
  });

  bossDrones.forEach(function(d){
    if(d.dead)return;
    playerBullets.forEach(function(b){
      if(Math.abs(b.x-d.x)<14&&Math.abs(b.y-d.y)<14){
        b.life=0;d.dead=true;addParticles(d.x,d.y,'#1aaa88',6,60,0.5);sfxEnemyDeath();
      }
    });
  });
  bossDrones=bossDrones.filter(function(d){return !d.dead});

  if(boss&&!player.dead&&player.invTime<=0&&slipstreamActive<=0&&Math.abs(boss.x-player.x)<50&&Math.abs(boss.y-player.y)<40){hitPlayer()}
}

function updateBossGrixoth(dt){
  var phase=bossPhase;
  var bSpd=phase===3?180:phase===2?130:80;
  if(!boss.rushing){
    boss.x+=boss.vx*dt;
    if(boss.x<80){boss.x=80;boss.vx=bSpd}
    if(boss.x>W-80){boss.x=W-80;boss.vx=-bSpd}
    boss.vx=boss.vx>0?bSpd:-bSpd;
  }
  bossTimer+=dt;
  if(phase===1){
    if(bossTimer>1.5){bossTimer=0;for(var i=0;i<7;i++){var a=Math.PI*0.15+i*Math.PI*0.7/6;enemyBullets.push({x:boss.x,y:boss.y+30,vx:Math.cos(a)*200,vy:Math.sin(a)*200,life:3,color:'#f44'})}}
  }else if(phase===2){
    if(bossTimer>2){bossTimer=0;for(var i=0;i<8;i++){var a=i*Math.PI*2/8;enemyBullets.push({x:boss.x,y:boss.y+30,vx:Math.cos(a)*160,vy:Math.sin(a)*160,life:3,color:'#f44'})}}
    boss.chargeTimer=(boss.chargeTimer||0)+dt;
    if(boss.chargeTimer>4){boss.chargeTimer=0;var ang=Math.atan2(player.y-boss.y,player.x-boss.x);
      enemyBullets.push({x:boss.x-20,y:boss.y+20,vx:Math.cos(ang)*120,vy:Math.sin(ang)*120,life:5,color:'#f80',homing:true,r:6});
      enemyBullets.push({x:boss.x+20,y:boss.y+20,vx:Math.cos(ang)*120,vy:Math.sin(ang)*120,life:5,color:'#f80',homing:true,r:6});
    }
  }else{
    if(bossTimer>0.8){bossTimer=0;for(var i=0;i<5;i++){var spread2=(i-2)*0.2;enemyBullets.push({x:boss.x,y:boss.y+30,vx:spread2*200,vy:250,life:3,color:'#f44'})}}
    boss.chargeTimer=(boss.chargeTimer||0)+dt;
    if(!boss.rushing&&boss.chargeTimer>3){boss.telegraph=(boss.telegraph||0)+dt;
      if(boss.telegraph>0.5){boss.rushing=true;boss.rushDir=player.x>boss.x?1:-1;boss.telegraph=0;boss.chargeTimer=0}
    }
    if(boss.rushing){
      boss.x+=boss.rushDir*500*dt;
      if(boss.x<40||boss.x>W-40){boss.rushing=false;boss.vx=80*(boss.x<W/2?1:-1)}
      if(!player.dead&&player.invTime<=0&&slipstreamActive<=0&&Math.abs(boss.x-player.x)<50&&Math.abs(boss.y-player.y)<40){hitPlayer()}
    }
  }
}

function updateBossBlurp(dt){
  var phase=bossPhase;
  var wobbleSpd=phase===3?120:60;
  boss.x+=boss.vx*dt;
  if(boss.x<80){boss.x=80;boss.vx=wobbleSpd}
  if(boss.x>W-80){boss.x=W-80;boss.vx=-wobbleSpd}
  boss.vx=boss.vx>0?wobbleSpd:-wobbleSpd;
  bossTimer+=dt;

  if(phase===1){
    if(bossTimer>1.8){bossTimer=0;
      for(var i=0;i<3;i++){
        var spread3=(i-1)*0.3;
        enemyBullets.push({x:boss.x+spread3*30,y:boss.y+40,vx:spread3*40,vy:130,life:5,color:'#44ff88',r:14,isBlob:true});
      }
    }
  }else if(phase===2){
    boss.teleportTimer=(boss.teleportTimer||0)+dt;
    if(boss.teleportTimer>3){boss.teleportTimer=0;boss.flashTime=0.3;boss.x=80+Math.random()*(W-160)}
    if(bossTimer>1.8){bossTimer=0;
      for(var i=0;i<5;i++){var spread4=(i-2)*0.25;enemyBullets.push({x:boss.x+spread4*30,y:boss.y+40,vx:spread4*50,vy:130,life:5,color:'#44ff88',r:14,isBlob:true})}
    }
    if(bossDrones.length<2){
      bossDrones.push({x:boss.x,y:boss.y,angle:bossDrones.length*Math.PI,fireTimer:2.5,dead:false});
    }
    bossDrones.forEach(function(d){
      d.angle+=dt*1.5;
      d.x=boss.x+Math.cos(d.angle)*80;
      d.y=boss.y+Math.sin(d.angle)*80;
      d.fireTimer-=dt;
      if(d.fireTimer<=0&&!player.dead){
        d.fireTimer=2.5;
        var ang=Math.atan2(player.y-d.y,player.x-d.x);
        enemyBullets.push({x:d.x,y:d.y,vx:Math.cos(ang)*160,vy:Math.sin(ang)*160,life:3,color:'#1aaa88',r:4});
      }
    });
  }else{
    boss.teleportTimer=(boss.teleportTimer||0)+dt;
    if(boss.teleportTimer>1.5){boss.teleportTimer=0;boss.flashTime=0.3;boss.x=80+Math.random()*(W-160)}
    boss.slimeWallTimer=(boss.slimeWallTimer||0)+dt;
    if(boss.slimeWallTimer>4){boss.slimeWallTimer=0;
      for(var i=0;i<8;i++){enemyBullets.push({x:50+i*(W-100)/7,y:boss.y+40,vx:0,vy:140,life:5,color:'#ff4444',r:14,isBlob:true})}
    }
    if(bossTimer>1.5){bossTimer=0;
      for(var i=0;i<3;i++){var spread5=(i-1)*0.3;enemyBullets.push({x:boss.x+spread5*30,y:boss.y+40,vx:spread5*50,vy:130,life:5,color:'#44ff88',r:14,isBlob:true})}
    }
  }
  enemyBullets.forEach(function(b){if(b.isBlob&&b.y>H-20){b.life=0;addParticles(b.x,H-10,'#44ff88',5,40,0.5)}});
}

function updateBossZara(dt){
  var phase=bossPhase;
  bossFig8Time+=dt*(phase===3?1.5:0.8);
  var fig8X=W/2+Math.sin(bossFig8Time)*250;
  var fig8Y=120+Math.sin(bossFig8Time*2)*60;
  if(phase===3){
    boss.x+=(fig8X-boss.x)*dt*6+(Math.sin(gameTime*8)*80)*dt;
    boss.y+=(fig8Y-boss.y)*dt*6;
  }else{
    boss.x+=(fig8X-boss.x)*dt*3;
    boss.y+=(fig8Y-boss.y)*dt*3;
  }
  bossTimer+=dt;

  if(phase===1){
    if(bossTimer>1.5){bossTimer=0;
      for(var i=0;i<6;i++){var a=i*Math.PI*2/6;enemyBullets.push({x:boss.x,y:boss.y,vx:Math.cos(a)*140,vy:Math.sin(a)*140,life:1.4,color:'#ff88cc',r:8,isDiamond:true})}
    }
  }else if(phase===2){
    if(bossClones.length<2){
      bossClones=[{offsetX:-150,opacity:0.4,fireTimer:1.5},{offsetX:150,opacity:0.4,fireTimer:1.5}];
    }
    bossClones.forEach(function(cl){
      cl.fireTimer=(cl.fireTimer||1.5)-dt;
      if(cl.fireTimer<=0){cl.fireTimer=2;
        var cx=boss.x+cl.offsetX,cy=boss.y;
        for(var i=0;i<4;i++){var a=i*Math.PI*2/4;enemyBullets.push({x:cx,y:cy,vx:Math.cos(a)*120,vy:Math.sin(a)*120,life:1.4,color:'#ff88cc',r:6,isDiamond:true})}
      }
    });
    if(bossTimer>1.2){bossTimer=0;
      for(var i=0;i<6;i++){var a=i*Math.PI*2/6;enemyBullets.push({x:boss.x,y:boss.y,vx:Math.cos(a)*140,vy:Math.sin(a)*140,life:1.4,color:'#ff88cc',r:8,isDiamond:true})}
    }
    boss.chargeTimer=(boss.chargeTimer||0)+dt;
    if(boss.chargeTimer>3){boss.chargeTimer=0;
      for(var i=0;i<12;i++){var a=i*Math.PI*2/12+gameTime;enemyBullets.push({x:boss.x,y:boss.y,vx:Math.cos(a)*180,vy:Math.sin(a)*180,life:2,color:'#ff44aa',r:5})}
    }
    playerBullets.forEach(function(b){
      bossClones.forEach(function(cl){
        var cx=boss.x+cl.offsetX,cy=boss.y;
        if(Math.abs(b.x-cx)<40&&Math.abs(b.y-cy)<50){b.life=0;addParticles(b.x,b.y,'#f44',4,40,0.3)}
      });
    });
  }else{
    if(bossClones.length>0)bossClones.forEach(function(cl){cl.opacity=0.7});
    if(bossTimer>0.6){bossTimer=0;
      for(var i=0;i<6;i++){var a=i*Math.PI*2/6+gameTime*2;enemyBullets.push({x:boss.x,y:boss.y,vx:Math.cos(a)*160,vy:Math.sin(a)*160,life:1.4,color:'#ff88cc',r:8,isDiamond:true})}
    }
    boss.chargeTimer=(boss.chargeTimer||0)+dt;
    if(boss.chargeTimer>5){boss.chargeTimer=0;
      for(var i=0;i<24;i++){var a=i*Math.PI*2/24;enemyBullets.push({x:boss.x,y:boss.y,vx:Math.cos(a)*200,vy:Math.sin(a)*200,life:2,color:'#fff',r:5})}
    }
  }
}

var menuHover='';
C.addEventListener('mousemove',function(e){

function drawMenuBtn(x,y,w,h,text,hover){
  X.save();X.fillStyle=hover?'#0a4':'#072';X.strokeStyle='#0f0';X.lineWidth=hover?2:1;
  X.beginPath();X.roundRect(x-w/2,y-h/2,w,h,8);X.fill();X.stroke();

function hitBtn(cx,cy,bx,by,bw,bh){return cx>bx-bw/2&&cx<bx+bw/2&&cy>by-bh/2&&cy<by+bh/2}

  X.fillStyle='#aaa';X.font='14px "Courier New",monospace';X.fillText('Level '+overallLevel,W/2,320);
  drawMenuBtn(W/2,380,180,48,'RETRY');
  drawMenuBtn(W/2,445,180,48,'MENU');
}

function renderVictory(){
  X.fillStyle='rgba(0,0,0,0.6)';X.fillRect(0,0,W,H);
  X.save();X.fillStyle='#FFD700';X.font='bold 40px "Courier New",monospace';X.textAlign='center';
  X.shadowColor='#FFD700';X.shadowBlur=30;
  var names=['\u26A1 GRIXOTH DEFEATED! \u26A1','\u26A1 BLURP DEFEATED! \u26A1','\u2728 QUEEN DEFEATED \u2728'];
  X.fillText(names[currentBossType],W/2,260);
  X.shadowBlur=0;X.restore();
  X.fillStyle='#ff0';X.font='24px "Courier New",monospace';X.textAlign='center';X.fillText('+$60',W/2,310);
  X.fillStyle='#8f8';X.font='14px "Courier New",monospace';X.fillText('Entering shop...',W/2,350);
  if(Math.random()<0.3)addParticles(Math.random()*W,Math.random()*H/2,['#f0f','#0ff','#ff0','#0f0'][Math.floor(Math.random()*4)],2,40,1.5);
}

window.addEventListener('keydown',function(e){
  if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();
});

// Initial UI visibility
if(playMode==='PHONE')applyPhoneControls();
updateUIVisibility();

document.addEventListener('visibilitychange',function(){
  if(document.hidden&&(state==='CAPTURE'||state==='BOSS')&&!paused)togglePause();
});

requestAnimationFrame(gameLoop);
})();
</script>
</body>
</html>
